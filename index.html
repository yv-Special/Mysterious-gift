<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'">
  <script src="./pre.js"></script>
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="theme-color" content="#fef9ed">
  <link rel="icon" href="data:,">
  <title>一封封着的信</title>
  <link rel="stylesheet" href="./lock.css">
</head>
<body>
  <div class="frame" aria-hidden="true"></div>
  <main class="lock">
    <div class="paper">
      <p class="eyebrow">SEALED LETTER</p>
      <svg class="seal" viewBox="0 0 100 100" aria-hidden="true">
        <circle cx="50" cy="50" r="46" fill="#c05a3c"/>
        <circle cx="50" cy="50" r="42.5" fill="none" stroke="#a84a30" stroke-width="1"/>
        <circle cx="50" cy="50" r="37" fill="none" stroke="#f6ded2" stroke-width="0.6" stroke-dasharray="1.6 2.6"/>
        <g transform="translate(50 50)" stroke="#fff7ee" stroke-width="1.9" stroke-linecap="round">
          <g transform="rotate(0)"><line x1="0" y1="-8" x2="0" y2="-25"/><line x1="0" y1="-18" x2="-6.5" y2="-23.5"/><line x1="0" y1="-18" x2="6.5" y2="-23.5"/></g>
          <g transform="rotate(60)"><line x1="0" y1="-8" x2="0" y2="-25"/><line x1="0" y1="-18" x2="-6.5" y2="-23.5"/><line x1="0" y1="-18" x2="6.5" y2="-23.5"/></g>
          <g transform="rotate(120)"><line x1="0" y1="-8" x2="0" y2="-25"/><line x1="0" y1="-18" x2="-6.5" y2="-23.5"/><line x1="0" y1="-18" x2="6.5" y2="-23.5"/></g>
          <g transform="rotate(180)"><line x1="0" y1="-8" x2="0" y2="-25"/><line x1="0" y1="-18" x2="-6.5" y2="-23.5"/><line x1="0" y1="-18" x2="6.5" y2="-23.5"/></g>
          <g transform="rotate(240)"><line x1="0" y1="-8" x2="0" y2="-25"/><line x1="0" y1="-18" x2="-6.5" y2="-23.5"/><line x1="0" y1="-18" x2="6.5" y2="-23.5"/></g>
          <g transform="rotate(300)"><line x1="0" y1="-8" x2="0" y2="-25"/><line x1="0" y1="-18" x2="-6.5" y2="-23.5"/><line x1="0" y1="-18" x2="6.5" y2="-23.5"/></g>
        </g>
        <circle cx="50" cy="50" r="2.2" fill="#fff7ee"/>
      </svg>
      <h1>这封信<br>封着等你</h1>
      <p class="sub">写下口令，拆开封蜡。</p>

      <div class="entry">
        <label for="code" class="sr">口令</label>
        <input id="code" type="text" inputmode="numeric" maxlength="12" placeholder="· · · ·"
               autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-describedby="err">
        <button type="button" id="open">拆 开</button>
      </div>

      <p id="err" class="err" role="status" aria-live="polite"></p>
      <p class="hint">口令在发给你链接的那条消息里。<br>拆开后，这台设备会记住你。</p>
    </div>
  </main>
  <noscript>这封信需要开启 JavaScript 才能拆开。</noscript>
  <script src="./unlock.js"></script>
</body>
</html>
