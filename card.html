<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <script src="./guard.js"></script>
  <meta name="theme-color" content="#fbfaf9"><link rel="icon" href="data:,">
  <title>纸上来信</title><link rel="stylesheet" href="./fonts.css"><link rel="stylesheet" href="./paper.css">
</head>
<body>
  <main data-renderer="loading">
    <header><h1>纸雕贺卡</h1></header>
    <div class="stage" id="stage">
      <img class="proof" src="./cover.webp" alt="纸雕贺卡封面" draggable="false">
      <canvas aria-hidden="true"></canvas>
      <article id="letter" aria-label="贺卡内页" hidden><div class="writing" tabindex="0" role="region" aria-label="内页文字"><p id="greeting"></p><p id="message"></p><p id="signature"></p></div></article>
    </div>
    <nav class="dock" aria-label="贺卡操作">
      <button type="button" id="toggle" aria-label="翻开贺卡" title="翻开" aria-controls="letter" aria-expanded="false" disabled>
        <svg class="icon-closed" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 7v14" />
          <path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z" />
        </svg>
        <svg class="icon-open" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 21V7" />
          <path d="m16 12 2 2 4-4" />
          <path d="M22 6V4a1 1 0 0 0-1-1h-5a4 4 0 0 0-4 4 4 4 0 0 0-4-4H3a1 1 0 0 0-1 1v13a1 1 0 0 0 1 1h6a3 3 0 0 1 3 3 3 3 0 0 1 3-3h6a1 1 0 0 0 1-1v-1.3" />
        </svg>
      </button>
      <button type="button" id="music-toggle" aria-label="静音背景音乐" title="静音" aria-pressed="false" hidden>
        <svg class="icon-sound" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M11 4.7a.7.7 0 0 0-1.2-.5L6.4 7.6A1.4 1.4 0 0 1 5.4 8H3a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2.4a1.4 1.4 0 0 1 1 .4l3.4 3.4a.7.7 0 0 0 1.2-.5z" />
          <path d="M16 9a5 5 0 0 1 0 6" />
          <path d="M19.4 18.4a9 9 0 0 0 0-12.8" />
        </svg>
        <svg class="icon-muted" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M11 4.7a.7.7 0 0 0-1.2-.5L6.4 7.6A1.4 1.4 0 0 1 5.4 8H3a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2.4a1.4 1.4 0 0 1 1 .4l3.4 3.4a.7.7 0 0 0 1.2-.5z" />
          <line x1="22" x2="16" y1="9" y2="15" />
          <line x1="16" x2="22" y1="9" y2="15" />
        </svg>
      </button>
    </nav>
    <audio id="bgm" preload="none"></audio>
    <a id="credit" class="credit" href="https://github.com/dongliang1993/3d-card-master" target="_blank" rel="noopener noreferrer">Made with 3d-card-master</a>
    <p id="status" role="status" class="notice">本地预览：在本目录运行 python3 -m http.server 8000 --bind 127.0.0.1，再打开 http://127.0.0.1:8000/。</p>
  </main>
  <noscript>请启用 JavaScript 来翻开贺卡。</noscript>
  <script type="module" src="./app.js"></script>
</body>
</html>
